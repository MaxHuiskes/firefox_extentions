<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      width: 420px;
      margin: 0;
      background: #f9f9fb;
      color: #202124;
      box-sizing: border-box;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h3 {
      margin: 0;
      font-size: 13px;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 8px;
      padding: 8px 10px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #1a73e8;
    }
    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .status-msg {
      font-size: 11px;
      color: #137333;
      font-weight: 500;
      height: 16px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-weight: 600;
      font-size: 12px;
    }
    .secondary-btn {
      background: #e0e0e0;
      color: #333;
    }
    .secondary-btn:hover {
      background: #d0d0d0;
    }
    hr {
      margin: 14px 0;
      border: none;
      border-top: 1px solid #ddd;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 350px;
      overflow-y: auto;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .info {
      flex: 1;
      font-size: 13px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .info a {
      color: #1a73e8;
      text-decoration: none;
    }
    .info a:hover {
      text-decoration: underline;
    }
    .actions {
      display: flex;
      gap: 6px;
      margin-left: 10px;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      font-size: 14px;
    }
    .empty-msg {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <h3 id="form-title">Anime Bewerken / Toevoegen</h3>
    <button id="open-options-btn" class="secondary-btn">⚙ Opties</button>
  </div>

  <input type="text" id="title" placeholder="Anime Titel">
  <input type="url" id="url" placeholder="Pagina URL">
  <input type="text" id="episode" placeholder="Aflevering">

  <div class="top-actions">
    <div id="status" class="status-msg"></div>
  </div>

  <hr>
  <h3>Opgeslagen Anime</h3>
  <ul id="anime-list"></ul>

  <script src="popup.js"></script>
</body>
</html>
